<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>PSD Layer Tagger</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div>
        <div class="eyebrow">PSD2NGUI</div>
        <h1>Layer Tagger</h1>
      </div>
      <button id="refreshBtn" class="icon-btn" title="刷新当前选中图层">Refresh</button>
    </header>

    <section class="status-card">
      <div id="statusText" class="status-text">等待 Photoshop 选择...</div>
      <div id="layerList" class="layer-list"></div>
    </section>

    <section class="mode-row">
      <label class="mode-pill">
        <input type="radio" name="tagMode" value="set" checked>
        <span>替换已有标签</span>
      </label>
      <label class="mode-pill">
        <input type="radio" name="tagMode" value="append">
        <span>追加标签</span>
      </label>
    </section>

    <section class="tag-section">
      <h2>通用组件</h2>
      <div class="grid tags-primary" id="stdTags"></div>
    </section>

    <section class="tag-section">
      <h2>基础节点</h2>
      <div class="grid" id="basicTags"></div>
    </section>

    <section class="tag-section">
      <h2>布局</h2>
      <div class="grid" id="layoutTags"></div>
    </section>

    <section class="utility-row">
      <button id="clearBtn" class="danger">清除 PSD 标签</button>
      <button id="copyBtn">复制图层名</button>
    </section>

    <footer class="hint">
      面板是非模态的，可以一直停靠着用。先在图层面板选择图层，再点标签按钮即可。
    </footer>
  </main>

  <script src="./js/cep.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
